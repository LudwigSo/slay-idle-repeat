; Export presets for the client — M7-10.
;
; Only the options this project actually sets are listed. Godot fills every other
; option from EditorExportPlatform::get_export_options() defaults when the preset
; is loaded, so a partial file is valid and far less brittle than transcribing the
; full option set — which changes between point releases.
;
; The recipe these presets implement is docs/spikes/O23-godot-android-export.md
; (M0-05a, executed for real). This file does not re-research it.
;
; 🔒 gradle_build/use_gradle_build=true is THE load-bearing line on the Android
; preset: it selects the custom build template (Gradle) path instead of the
; one-click prebuilt-APK path. 12 §3.2 requires it, because the AppLovin MAX AARs
; can only be injected on the Gradle path — so a plain export produces an APK
; that cannot serve an ad. It is also the line whose effect the CI job asserts:
; a .NET export lands in apk/mono/debug/, an engine-only one in apk/standard/.
;
; ⚠️ The MAX plugin itself is NOT here and is not referenced. Its adapter project
; (SlayIdleRepeat.Adapters.Ads.AppLovin) is empty until M15-04, and 23 §7.2a
; forbids naming a plugin the build cannot supply. What M7-10 owes 12 §3.2 is that
; the Gradle path — the only path a plugin can ever be added on — is the path this
; project exports through, and that is what this preset fixes.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="bin/android/SlayIdleRepeat.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

gradle_build/use_gradle_build=true
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="de.ludwigso.slayidlerepeat"
package/name="Slay. Idle. Repeat."
package/signed=true

; ---------------------------------------------------------------------------
; The desktop preset, which is not a shipping target.
;
; 🔒 It exists so a full Chapter-1/2 run can be driven through an EXPORTED build
; rather than only through the editor, which is M7's exit criterion and a
; different thing from a headless editor run: an export packs res:// into a .pck,
; and M7-10x finding (1) is that System.IO cannot read a packed resource. A run
; that only ever passes in the editor proves nothing about the artefact a player
; gets.
;
; ⚠️ embed_pck=false on purpose — the .pck stays a separate file beside the
; executable. It is what lets the export be inspected without unpacking a binary,
; and the content mirror the build writes into data/ is exported with it.
; ---------------------------------------------------------------------------

[preset.1]

name="Linux/X11"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="bin/linux/SlayIdleRepeat.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

binary_format/embed_pck=false
binary_format/architecture="x86_64"

[preset.2]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="bin/windows/SlayIdleRepeat.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.2.options]

binary_format/embed_pck=false
binary_format/architecture="x86_64"
