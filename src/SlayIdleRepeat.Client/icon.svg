<!--
  The Godot project icon. A PROJECT FILE, not a game asset: the engine refuses to load a
  project without one, and it is the launcher/editor icon, never something the game draws.
  It is deliberately two primitives and no craft — the shipped app icon is the art
  milestone's, and this must not be mistaken for a first draft of it.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="24" fill="#2b2f3a"/>
  <g fill="#e0b64a">
    <circle cx="40" cy="40" r="11"/>
    <circle cx="64" cy="64" r="11"/>
    <circle cx="88" cy="88" r="11"/>
  </g>
</svg>
