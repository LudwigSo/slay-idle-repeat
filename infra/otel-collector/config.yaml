# Slay Idle Repeat — OpenTelemetry Collector.
#
# 14 §10, verbatim:
#   | Metrics & tracing | **OpenTelemetry → Prometheus + Grafana** |
#     Vendor-neutral instrumentation. Swap the backend freely. |
#
# This file IS the "swap the backend freely" part. The application knows one
# thing: push OTLP to $OTEL_EXPORTER_OTLP_ENDPOINT. Where it goes afterwards is
# decided here and nowhere else — replacing Jaeger with Tempo, or Prometheus with
# a remote-write endpoint, is an edit to this file and to no C# whatsoever.
#
#   OTLP in  :4317 gRPC / :4318 HTTP
#     traces  -> jaeger (OTLP gRPC) + debug log
#     metrics -> prometheus scrape endpoint on :8889 + debug log
#     logs    -> debug log            (14 §10 takes the "plain stdout" option for
#                                      log aggregation; see infra/README.md)
#
# ⚠️ AS OF M0-03 THE APPLICATION SENDS NOTHING. The OTel SDK is registered in the
# server by M5-11. What is provably working today is the pipeline: the collector
# accepts OTLP, forwards traces to Jaeger, and its own self-telemetry is scraped
# by Prometheus and rendered in Grafana. See infra/README.md § "What is proven".

receivers:
  otlp:
    protocols:
      grpc:
        # 0.0.0.0, not localhost: the API is a different container.
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batching is not optional at any real volume — it is the difference between
  # one export per span and one per few hundred.
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

  # A hard ceiling, so a burst of telemetry can never be the thing that kills the
  # laptop. Over the limit the collector refuses data (and says so) instead of
  # being OOM-killed and losing the pipeline entirely.
  memory_limiter:
    check_interval: 2s
    limit_mib: 300
    spike_limit_mib: 64

  # Everything that leaves here is labelled with where it came from, so a metric
  # in Prometheus can be traced back to this stack rather than a deployed one.
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

exporters:
  # ---- traces ----------------------------------------------------------
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      # Plaintext on a private compose network between two containers. There is
      # no certificate authority on a laptop and inventing one would be theatre.
      insecure: true

  # ---- metrics ---------------------------------------------------------
  # Pull-based: the collector exposes what it has received and Prometheus scrapes
  # it (see infra/prometheus/prometheus.yml, job `otel-collector-app`).
  prometheus:
    endpoint: 0.0.0.0:8889
    # Carry OTel resource attributes (service.name, deployment.environment, ...)
    # onto the Prometheus series as labels; without this every service's metrics
    # collapse into one indistinguishable series.
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true

  # ---- everything, to the collector's stdout ---------------------------
  # The reason `docker compose logs otel-collector` is a useful debugging tool
  # when M5-11 first turns the SDK on and nothing shows up in Jaeger.
  # `basic` keeps it to counts; raise to `detailed` when hunting a specific span.
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  # What docker-compose.yml's healthcheck polls. Answers 200 only once every
  # pipeline below has started, which is exactly the signal `up --wait` needs.
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]

  telemetry:
    logs:
      level: info
      encoding: json      # 14 §10 "Structured JSON logs"
    metrics:
      # The collector's OWN metrics, on :8888. This is what makes the telemetry
      # pipeline observable before the application emits anything at all: if
      # otelcol_receiver_accepted_spans is climbing, spans are arriving.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  pipelines:
    traces:
      receivers: [otlp]
      # memory_limiter first, always — it can only shed load it sees before the
      # batcher has already buffered it.
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/jaeger, debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      # stdout only — 14 §10 offers "Loki (or plain stdout + the platform's log
      # store)" and this stack takes the second option. Adding Loki later means
      # adding one exporter here, one service in docker-compose.yml and one
      # Grafana datasource file; nothing in the application changes.
      exporters: [debug]
