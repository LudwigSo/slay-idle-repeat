; Android export preset for the O23 spike.
;
; Only the options this spike actually cares about are listed. Godot fills every
; other option from EditorExportPlatform::get_export_options() defaults when the
; preset is loaded, so a partial file is valid and much less brittle than
; transcribing the full option set.
;
; gradle_build/use_gradle_build=true is THE load-bearing line: it selects the
; custom build template (Gradle) path instead of the one-click prebuilt-APK
; path. Doc 12 section 3.2 requires this, because
; the AppLovin MAX AARs can only be injected on the Gradle path.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="bin/SlayIdleRepeatSpike.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

gradle_build/use_gradle_build=true
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="de.ludwigso.slayidlerepeat"
package/name="Slay. Idle. Repeat."
package/signed=true
