; iOS export preset for the O23 spike (task M0-05b).
;
; ⚠️ NEVER EXECUTED. Every option below was read out of the Godot 4.7.1-stable
; source (editor/export/editor_export_platform_apple_embedded.cpp and
; platform/ios/export/export_plugin.cpp) rather than produced by the editor, so
; treat it as a hypothesis. Godot fills every option not listed here from
; EditorExportPlatform::get_export_options() defaults when the preset is loaded,
; so a partial file is valid and far less brittle than transcribing the ~90
; icon/privacy options.
;
; See spike O23's iOS leg §3 and §4 for why each line is here.
;
; THREE LINES ARE LOAD-BEARING:
;
;   application/app_store_team_id
;       Required. A blank value aborts the export before anything is written:
;       ERR_FAIL_COND_V_MSG(team_id.length() == 0, ...,
;                           "App Store Team ID not specified - cannot configure the project.")
;       There is NO environment override for it. The placeholder below is a
;       syntactically valid ten-character string and is NOT a real Team ID —
;       whether Godot gets far enough with a fictitious one is the open
;       question in §9 step 3, and answering it decides whether CI can export at
;       all before anyone buys an Apple Developer account.
;
;   application/export_project_only=true
;       The engine default is FALSE, and with the default Godot runs
;       `xcodebuild archive` and `xcodebuild -exportArchive` itself and needs
;       working code signing at export time. `true` stops after generating the
;       Xcode project — the account-free path, and the one the class reference
;       recommends when another build pipeline owns signing.
;
;   application/min_ios_version
;       Left at the 4.7 default of 15.0 deliberately. It was 14.0 at 4.5/4.6, so
;       this is a floor that moved under us, and it is a product decision rather
;       than a toolchain one. Record it alongside the A12 capability the mobile
;       renderer forces (see project.godot).
;
; Signing is left fully empty on purpose. The exporter INFERS manual-vs-automatic
; signing from whether any of {code_sign_identity, provisioning_profile_uuid,
; provisioning_profile_specifier} is non-empty; all-empty yields
; CODE_SIGN_STYLE = Automatic. Setting exactly one of them is the trap behind
; engine issue #110052. Note also that the two provisioning_profile_uuid_* keys
; carry PROPERTY_USAGE_SECRET, so the editor writes them to the gitignored
; res://.godot/export_credentials.cfg, never to this file.

[preset.0]

name="iOS"
platform="iOS"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
; Deliberately OUTSIDE the Godot project: artifacts/ is already gitignored, and
; keeping the generated Xcode project out of the project tree is what saves iOS
; from the Android leg's failure 6, where the generated android/ tree got its
; .cs files recompiled as duplicates. Godot does not create this directory —
; `mkdir -p` it first or the export fails with
; "Target folder does not exist or is inaccessible".
export_path="../../artifacts/ios/SlayIdleRepeatIosSpike.xcodeproj"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

application/app_store_team_id="AAAAAAAAAA"
application/bundle_identifier="de.ludwigso.slayidlerepeat"
application/short_version="0.1.0"
application/version="0.1.0"
application/min_ios_version="15.0"
application/targeted_device_family=2
application/export_project_only=true
application/code_sign_identity_debug=""
application/code_sign_identity_release=""
application/provisioning_profile_specifier_debug=""
application/provisioning_profile_specifier_release=""
architectures/arm64=true
